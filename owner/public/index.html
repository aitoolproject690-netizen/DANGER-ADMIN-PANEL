<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>DANGER OWNER PANEL</title><link rel="stylesheet" href="/style.css"></head><body><div id="login" class="center"><div class="login card"><div class="brand">DANGER <span>OWNER PANEL</span></div><p>MASTER CONTROL CENTER</p><input id="lu" placeholder="Owner username"><input id="lp" type="password" placeholder="Owner password"><button onclick="login()">ENTER OWNER PANEL</button></div></div><div id="app" hidden><header><div class="brand">DANGER <span>OWNER PANEL</span></div><div><span id="clock"></span><button onclick="logout()">LOGOUT</button></div></header><main><aside><button class="active">Dashboard</button><button onclick="scrollToSection('panels')">Admin Panels</button><button onclick="scrollToSection('logs')">Audit Logs</button></aside><section><div class="hero"><div><small>MASTER CONTROL</small><h1>OWNER DASHBOARD</h1><p>Control every DANGER Admin Panel from one place.</p></div><button onclick="openCreate()">+ CREATE PANEL</button></div><div id="stats" class="grid"></div><div id="panels" class="card"><div class="title">ADMIN PANELS</div><div id="list"></div></div><div id="logs" class="card"><div class="title">RECENT AUDIT LOGS</div><div id="logsList"></div></div></section></main></div><div id="modal" class="modal" hidden><div class="card"><h2>Create Admin Panel</h2><input id="pn" placeholder="Panel name"><input id="pu" placeholder="Panel URL"><input id="pd" type="number" value="30" placeholder="Validity days"><button onclick="createPanel()">CREATE</button><button class="ghost" onclick="closeModal()">CANCEL</button><pre id="tokenOut"></pre></div></div><script src="/app.js"></script></body></html>
